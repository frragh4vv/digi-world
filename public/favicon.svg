<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#09090e"/>
  <!-- pixel house roof -->
  <rect x="14" y="4"  width="4" height="2" fill="#00ffff"/>
  <rect x="12" y="6"  width="8" height="2" fill="#00ffff"/>
  <rect x="10" y="8"  width="12" height="2" fill="#00ffff"/>
  <rect x="8"  y="10" width="16" height="2" fill="#00ffff"/>
  <!-- house body -->
  <rect x="9"  y="12" width="14" height="12" fill="#111116" stroke="#00ff66" stroke-width="2"/>
  <!-- window -->
  <rect x="12" y="15" width="3" height="3" fill="#ff007f"/>
  <rect x="17" y="15" width="3" height="3" fill="#ffd700"/>
  <!-- door -->
  <rect x="14" y="19" width="4" height="5" fill="#00ff66"/>
  <!-- ground line -->
  <rect x="6"  y="24" width="20" height="2" fill="#00ff66"/>
</svg>
